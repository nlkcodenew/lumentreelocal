; Dedicated Lumentree BLE bridge firmware.
; This project is intentionally separate from the main ESP32 multi-feature firmware.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = ${PROJECT_DIR}/huge_app.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLUMENTREE_FIRMWARE_NAME=\"lumentree-ble-bridge\"
    -DLUMENTREE_FIRMWARE_VERSION=\"0.14.0\"

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.4.3

